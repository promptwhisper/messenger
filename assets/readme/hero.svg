<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Messenger</title>
  <desc id="desc">A small courier follows an orbital route through a set of interactive 3D planets and characters.</desc>
  <defs>
    <radialGradient id="space" cx=".75" cy=".25" r=".9">
      <stop offset="0" stop-color="#243e79"/>
      <stop offset=".55" stop-color="#111d43"/>
      <stop offset="1" stop-color="#080d22"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d56b"/>
      <stop offset="1" stop-color="#f28a70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#space)"/>
  <g fill="#eef4ff" opacity=".75">
    <circle cx="723" cy="62" r="2"/><circle cx="1140" cy="74" r="3"/><circle cx="970" cy="33" r="2"/>
    <circle cx="658" cy="186" r="2"/><circle cx="1083" cy="228" r="2"/><circle cx="843" cy="320" r="3"/>
    <circle cx="522" cy="53" r="2"/><circle cx="580" cy="302" r="2"/>
  </g>
